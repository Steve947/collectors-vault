<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared Collection · Hoardr</title>
<meta name="description" content="A collection catalogued with Hoardr.">
<link rel="icon" href="icon-32.png">
<style>
  :root{ --bg:#0e0c08; --panel:#171309; --panel2:#1e1810; --line:rgba(201,168,76,.16);
    --text:#efe7d6; --text2:#cdc3ad; --text3:#8f866f; --gold:#c9a84c; --gold2:#e0c368; --green2:#7fbf8f; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  a{color:var(--gold2);text-decoration:none}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:11px 16px;background:rgba(14,12,8,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em;color:var(--gold2)}
  .brand .mark{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#c9a84c,#8b6f2a);
    display:flex;align-items:center;justify-content:center;font-size:14px}
  .cta{display:inline-block;background:linear-gradient(135deg,#c9a84c,#b08f34);color:#231a08;font-weight:700;
    padding:9px 15px;border-radius:8px;font-size:13px;white-space:nowrap}
  .cta:hover{filter:brightness(1.06)}
  .cta.small{padding:7px 12px;font-size:12px}
  main{max-width:1050px;margin:0 auto;padding:22px 16px 60px}
  .head{text-align:center;padding:26px 10px 10px}
  .cicon{font-size:46px;line-height:1}
  h1{font-size:26px;margin:10px 0 4px}
  .owner{color:var(--gold2);font-size:14px}
  .stats{color:var(--text3);font-size:12.5px;font-family:'IBM Plex Mono',ui-monospace,monospace;margin-top:6px}
  .desc{color:var(--text2);font-size:14px;max-width:640px;margin:12px auto 0}
  .group{margin-top:30px}
  .group h2{font-size:15px;color:var(--text2);border-bottom:1px solid var(--line);padding-bottom:7px;margin:0 0 14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;display:flex;flex-direction:column}
  .card .ph{aspect-ratio:1/1;background:var(--panel2);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .card .noimg{font-size:40px;opacity:.6}
  .cbody{padding:9px 10px 11px}
  .cname{font-weight:600;font-size:13.5px;line-height:1.3}
  .cmeta{color:var(--text3);font-size:11px;margin-top:3px}
  .cval{color:var(--gold2);font-size:11.5px;margin-top:5px;font-family:'IBM Plex Mono',ui-monospace,monospace}
  .empty{text-align:center;padding:80px 20px}
  .empty-emoji{font-size:54px}
  .empty h2{font-weight:600;font-size:18px;color:var(--text2);margin:14px 0 22px}
  .bottomcta{margin-top:48px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px 20px}
  .bottomcta h3{margin:0 0 6px;font-size:19px}
  .bottomcta p{color:var(--text2);font-size:14px;max-width:460px;margin:0 auto 18px}
  .foot{text-align:center;color:var(--text3);font-size:12px;padding:26px 16px 40px}
  .skel{color:var(--text3);text-align:center;padding:70px 20px}
  .card.zoomable{cursor:zoom-in}
  .card .ph{position:relative}
  .phcount{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px}
  #lightbox{position:fixed;inset:0;z-index:9999;background:rgba(8,7,4,.95);display:none;touch-action:none;overscroll-behavior:contain}
  #lightbox.open{display:block}
  #lightbox .lb-stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
  #lightbox .lb-img{position:absolute;left:0;top:0;max-width:none;max-height:none;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none}
  #lightbox .lb-close{position:absolute;top:14px;right:16px;z-index:3;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.25);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
  #lightbox .lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(0,0,0,.4);color:#fff;border:none;width:46px;height:64px;font-size:30px;cursor:pointer;border-radius:8px}
  #lightbox .lb-prev{left:10px}#lightbox .lb-next{right:10px}
  #lightbox .lb-nav[hidden]{display:none}
  #lightbox .lb-hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:12px;pointer-events:none;z-index:3}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check-compat.js"></script>
</head>
<body>
<div class="topbar">
  <a class="brand" href="https://hoardrapp.com/?from=share"><span class="mark">📦</span>Hoardr</a>
  <a class="cta small" href="https://hoardrapp.com/?from=share">Start your free collection →</a>
</div>
<main id="app"><div class="skel">Loading collection…</div></main>
<div class="foot">Catalogued with <a href="https://hoardrapp.com/?from=share">Hoardr</a> — the collection manager for people who keep things.</div>

<script>
(function(){
  var CFG={ apiKey:"AIzaSyC_LlFae2pwiu6c2Pt7avFAwZfFRmIYf9w", authDomain:"dads-collections.firebaseapp.com",
    projectId:"dads-collections", storageBucket:"dads-collections.firebasestorage.app",
    messagingSenderId:"1036789531654", appId:"1:1036789531654:web:4730152a416a24ff67ef87" };
  try{ if(!firebase.apps.length) firebase.initializeApp(CFG); }catch(e){}
  try{ firebase.appCheck().activate('6LeYsCwtAAAAAKXamnx3oouUurG0I1AS_VzabMSL', true); }catch(e){ console.warn('App Check init:',e); }
  var fdb=firebase.firestore();
  var el=document.getElementById('app');
  var id=new URLSearchParams(location.search).get('id');
  var LBP=[];
  el.addEventListener('click',function(e){ var c=e.target.closest&&e.target.closest('.card.zoomable'); if(c&&window.openLightbox){ openLightbox(LBP[+c.getAttribute('data-lbi')]||[],0,''); } });

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function money(v){ v=String(v==null?'':v).trim(); if(!v) return ''; return /^[$£€]/.test(v)?v:('$'+v); }
  function ctaBlock(){ return '<div class="bottomcta"><h3>Like what you see?</h3>'
    +'<p>Hoardr helps collectors catalogue, value and organise everything they own — free to start.</p>'
    +'<a class="cta" href="https://hoardrapp.com/?from=share">Start your own free collection →</a></div>'; }
  function notFound(msg){ el.innerHTML='<div class="empty"><div class="empty-emoji">🗃️</div><h2>'+esc(msg)+'</h2>'
    +'<a class="cta" href="https://hoardrapp.com/?from=share">Start your own free collection →</a></div>'; }

  function render(s){
    LBP=[];
    var groups = (s.type==='items' && s.items) ? [{name:'', icon:'', items:s.items}] : (s.groups||[]);
    var st=s.stats||{items:0,groups:0};
    var html='<div class="head"><div class="cicon">'+esc(s.icon||'🗂')+'</div>'
      +'<h1>'+esc(s.title||'Collection')+'</h1>'
      +(s.ownerName?'<div class="owner">by '+esc(s.ownerName)+'</div>':'')
      +'<div class="stats">'+esc(st.items||0)+' items'+(st.groups?(' · '+esc(st.groups)+' groups'):'')+'</div>'
      +(s.description?'<p class="desc">'+esc(s.description)+'</p>':'')+'</div>';
    groups.forEach(function(g){
      html+='<section class="group">'+(g.name?('<h2>'+esc(g.icon||'')+' '+esc(g.name)+'</h2>'):'')+'<div class="grid">';
      (g.items||[]).forEach(function(it){
        var hasPh=!!(it.photos&&it.photos.length), lbi=-1;
        if(hasPh){ lbi=LBP.length; LBP.push(it.photos); }
        var ph=hasPh
          ? '<div class="ph"><img loading="lazy" src="'+esc(it.photos[0])+'" alt="'+esc(it.name)+'">'+(it.photos.length>1?'<span class="phcount">'+it.photos.length+' \uD83D\uDCF7</span>':'')+'</div>'
          : '<div class="ph"><div class="noimg">'+esc(it.catEmoji||'📦')+'</div></div>';
        var meta=[]; if(it.condition) meta.push(esc(it.condition)); if(it.quantity>1) meta.push('×'+it.quantity);
        var metaLine=esc((it.catEmoji||'')+' '+(it.category||'')).trim()+(meta.length?' · '+meta.join(' · '):'');
        var val=[]; if(it.value) val.push('Value '+esc(money(it.value))); if(it.price) val.push('Paid '+esc(money(it.price)));
        html+='<div class="card'+(hasPh?' zoomable':'')+'"'+(hasPh?' data-lbi="'+lbi+'"':'')+'>'+ph+'<div class="cbody"><div class="cname">'+esc(it.name||'Untitled')+'</div>'
          +'<div class="cmeta">'+metaLine+'</div>'
          +(val.length?'<div class="cval">'+val.join(' · ')+'</div>':'')
          +'</div></div>';
      });
      html+='</div></section>';
    });
    html+=ctaBlock();
    el.innerHTML=html;
    document.title=(s.ownerName?esc(s.ownerName)+"'s ":'')+esc(s.title||'Collection')+' · Hoardr';
  }

  if(!id){ notFound('No collection was specified in this link.'); return; }
  fdb.collection('shares').doc(id).get().then(function(doc){
    if(!doc.exists){ notFound('This shared collection could not be found — the link may have been revoked.'); return; }
    var s=doc.data();
    if(s.expiresAt && s.expiresAt.toDate && s.expiresAt.toDate() < new Date()){ notFound('This share link has expired.'); return; }
    render(s);
  }).catch(function(e){
    console.warn('load share failed',e);
    var code=(e&&e.code)||'';
    notFound(code==='permission-denied'
      ? 'This shared page isn’t available — the link may have been revoked or has expired.'
      : 'This collection could not be loaded right now. Please try again later.');
  });
})();
</script>
<script>
(function(){
  var lb,stage,img,imgs=[],idx=0,natW=0,natH=0,fit=1,s=1,tx=0,ty=0;
  var pointers=new Map(),pinch=null,pan=null,lastTap=0;
  function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
  function rectS(){return stage.getBoundingClientRect();}
  function apply(){img.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';}
  function clamp(){var r=rectS(),w=natW*s,h=natH*s;
    if(w<=r.width)tx=(r.width-w)/2;else tx=Math.min(0,Math.max(r.width-w,tx));
    if(h<=r.height)ty=(r.height-h)/2;else ty=Math.min(0,Math.max(r.height-h,ty));}
  function fitReset(){var r=rectS();if(!natW){apply();return;}fit=Math.min(r.width/natW,r.height/natH);if(!isFinite(fit)||fit<=0)fit=1;s=fit;tx=(r.width-natW*s)/2;ty=(r.height-natH*s)/2;clamp();apply();}
  function zoomAt(px,py,ns){var r=rectS();px-=r.left;py-=r.top;ns=Math.max(fit,Math.min(fit*8,ns));tx=px-(px-tx)*(ns/s);ty=py-(py-ty)*(ns/s);s=ns;clamp();apply();}
  function toggleZoom(cx,cy){img.style.transition='transform .25s ease';if(s>fit*1.05){fitReset();}else{zoomAt(cx,cy,fit*2.6);}setTimeout(function(){img.style.transition='';},260);}
  function onWheel(e){e.preventDefault();img.style.transition='none';zoomAt(e.clientX,e.clientY,s*Math.exp(-e.deltaY*0.0015));}
  function onDown(e){try{stage.setPointerCapture(e.pointerId);}catch(x){}pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});img.style.transition='none';
    if(pointers.size===2){var p=[];pointers.forEach(function(v){p.push(v);});pinch={d:dist(p[0],p[1]),s:s,mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2};pan=null;}
    else if(pointers.size===1){pan={x:e.clientX,y:e.clientY,tx:tx,ty:ty};}}
  function onMove(e){if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2&&pinch){var p=[];pointers.forEach(function(v){p.push(v);});zoomAt(pinch.mx,pinch.my,pinch.s*(dist(p[0],p[1])/pinch.d));}
    else if(pointers.size===1&&pan&&s>fit*1.01){tx=pan.tx+(e.clientX-pan.x);ty=pan.ty+(e.clientY-pan.y);clamp();apply();}}
  function onUp(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(pointers.size===0)pan=null;
    if(e.pointerType==='touch'){var n=Date.now();if(n-lastTap<300){toggleZoom(e.clientX,e.clientY);lastTap=0;}else lastTap=n;}}
  function show(i){if(!imgs.length)return;idx=(i+imgs.length)%imgs.length;img.style.transition='';img.src=imgs[idx];var m=imgs.length>1;lb.querySelector('.lb-prev').hidden=!m;lb.querySelector('.lb-next').hidden=!m;}
  function close(){if(lb)lb.classList.remove('open');document.documentElement.style.overflow='';}
  function build(){
    lb=document.createElement('div');lb.id='lightbox';
    lb.innerHTML='<button class="lb-close" title="Close">✕</button><button class="lb-nav lb-prev" title="Previous">‹</button><button class="lb-nav lb-next" title="Next">›</button><div class="lb-stage"><img class="lb-img" alt=""></div><div class="lb-hint">Scroll or pinch to zoom · double-tap to reset · drag to pan</div>';
    document.body.appendChild(lb);
    stage=lb.querySelector('.lb-stage');img=lb.querySelector('.lb-img');
    lb.querySelector('.lb-close').onclick=close;
    lb.querySelector('.lb-prev').onclick=function(e){e.stopPropagation();show(idx-1);};
    lb.querySelector('.lb-next').onclick=function(e){e.stopPropagation();show(idx+1);};
    stage.addEventListener('wheel',onWheel,{passive:false});
    stage.addEventListener('pointerdown',onDown);stage.addEventListener('pointermove',onMove);
    stage.addEventListener('pointerup',onUp);stage.addEventListener('pointercancel',onUp);
    img.addEventListener('load',function(){natW=img.naturalWidth;natH=img.naturalHeight;fitReset();});
    img.addEventListener('dblclick',function(e){e.preventDefault();toggleZoom(e.clientX,e.clientY);});
    window.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')close();else if(e.key==='ArrowLeft')show(idx-1);else if(e.key==='ArrowRight')show(idx+1);});
    window.addEventListener('resize',function(){if(lb.classList.contains('open'))fitReset();});
  }
  window.openLightbox=function(list,start,alt){if(!lb)build();imgs=(list||[]).filter(Boolean);if(!imgs.length)return;idx=start||0;img.alt=alt||'';lb.classList.add('open');document.documentElement.style.overflow='hidden';show(idx);};
})();
</script>
</body>
</html>
